# Optional local stack for running the whole app with one command:
#   docker compose up
#
# The backend uses SQLite out of the box, so this is a convenience for
# containerised development — not a production topology.
services:
  backend:
    image: node:20
    working_dir: /app
    ports:
      - "8888:8888"
    environment:
      NODE_ENV: development
      PORT: "8888"
      DATABASE_URL: "file:./dev.db"
      FRONTEND_URL: "http://localhost:3000"
      CORS_ORIGINS: "http://localhost:3000"
      # JWT_SECRET is deliberately NOT set here. The backend falls back to a
      # stable development-only secret (see backend/src/config.ts) when it is
      # unset, and that same fallback applies when you run `npm run dev`
      # directly. Setting a *different* value here would give the containerised
      # and non-containerised backends different signing keys, so a token minted
      # by one would be rejected by the other as "Token is invalid or expired".
      # To use your own secret, set JWT_SECRET in backend/.env instead — that
      # file is read by both paths.
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npm install && npx prisma migrate deploy && npm run dev"

  frontend:
    image: node:20
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8888"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  backend_node_modules:
  frontend_node_modules:
